name: Build mod

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate iOS script mod
        shell: bash
        run: |
          test -f mod.hjson
          test -f scripts/main.js
          grep -q 'iosCompatible: true' mod.hjson
          if grep -Eq 'extend\(|JavaAdapter' scripts/main.js; then
            echo 'iOS-incompatible scripting API found.'
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-timescale-script
          path: |
            mod.hjson
            scripts/main.js
