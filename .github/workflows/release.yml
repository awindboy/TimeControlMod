name: Release mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate iOS script mod
        shell: bash
        run: |
          test -f mod.hjson
          test -f scripts/main.js
          grep -q 'iosCompatible: true' mod.hjson
          if grep -Eq 'extend\(|JavaAdapter' scripts/main.js; then
            echo 'iOS-incompatible scripting API found.'
            exit 1
          fi

      - name: Package script mod
        run: zip -r mindustry-timescale-script.zip mod.hjson scripts README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mindustry-timescale-script.zip
